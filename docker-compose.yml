services:
  swiggy-analytics-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swiggy-analytics-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/stats || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s
